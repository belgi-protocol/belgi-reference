name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Python reference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/release-requirements.txt

      - name: Install verification tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            -r .github/release-requirements.txt

      - name: Verify retained source
        run: |
          python -m ruff format --check belgi tests/public_reference .github/scripts
          python -m ruff check belgi tests/public_reference .github/scripts
          python -m pyright
          python -m pyright .github/scripts

      - name: Build the wheel once
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Select the exact wheel
        id: wheel
        run: |
          wheel="$(
            python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("belgi-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          print(wheels[0].resolve())
          PY
          )"
          printf 'path=%s\n' "${wheel}" >> "${GITHUB_OUTPUT}"

      - name: Verify source behavior, metadata, and wheel inventory
        env:
          BELGI_WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: python -m pytest -q tests/public_reference

      - name: Install the wheel in a relocated Python 3.11 environment
        env:
          BELGI_WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          environment="${RUNNER_TEMP}/belgi-reference-py311"
          python -m venv "${environment}"
          "${environment}/bin/python" -m pip install "${BELGI_WHEEL_PATH}"

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install the same wheel in a relocated Python 3.14 environment
        env:
          BELGI_WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          environment="${RUNNER_TEMP}/belgi-reference-py314"
          python -m venv "${environment}"
          "${environment}/bin/python" -m pip install "${BELGI_WHEEL_PATH}"

      - name: Run the installed reference contract
        run: |
          version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          for suffix in py311 py314; do
            environment="${RUNNER_TEMP}/belgi-reference-${suffix}"
            python .github/scripts/release_artifacts.py installed \
              --environment "${environment}" \
              --expected-version "${version}"
          done
